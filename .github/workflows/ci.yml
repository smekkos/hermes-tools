name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bump logic (offline)
        run: python3 -m unittest discover -s tests -v
      - name: every pin downloads, matches its sha256 and runs
        run: bash scripts/verify.sh tools.txt
